    "One button. One trail. One cold beer waiting at the end.",
    "Find a trail. Find a beer. Repeat every weekend.",
    "Hit the button. Get a trail, a beer spot, and zero excuses.",
    "Because every hike deserves a proper ending."
  ];

  const buttonCopies = [
    "Surprise me 🌿",
    "Just pick a trail",
    "Get me outside",
    "Send it",
    "Where am I going?",
    "Outside, now."
  ];

  const drinkLabels = [
    "You've earned it 🍺",
    "The real finish line",
    "Liquid recovery",
    "Advanced hydration",
    "Debrief location",
    "Now go drink"
  ];

  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('tagline').textContent = rand(taglines);
    document.querySelector('.go-btn').textContent = rand(buttonCopies);
  });

  const activeRegions = new Set();

  function toggleRegion(btn) {
    const region = btn.dataset.region;
    if (activeRegions.has(region)) {
      activeRegions.delete(region);
      btn.classList.remove('active');
    } else {
      activeRegions.add(region);
      btn.classList.add('active');
    }
  }

  function parseMiles(distStr) {
    return parseFloat(distStr);
  }

  function weightedPick(pool) {
    const dogOnly = document.getElementById("dogFilter").checked;
    if (!dogOnly) return pool[Math.floor(Math.random() * pool.length)];
    // Gaussian weight centered at 3 miles, sigma=1.2
    const weights = pool.map(t => Math.exp(-0.5 * Math.pow((parseMiles(t.distance) - 3) / 1.2, 2)));
    const total = weights.reduce((a, b) => a + b, 0);
    let r = Math.random() * total;
    for (let i = 0; i < pool.length; i++) {
      r -= weights[i];
      if (r <= 0) return pool[i];
    }
    return pool[pool.length - 1];
  }

  function suggest() {
    const dogOnly = document.getElementById("dogFilter").checked;
    const epicOnly = document.getElementById("epicFilter").checked;
    const output = document.getElementById("output");

    let pool = trails;
    if (activeRegions.size > 0) pool = pool.filter(t => activeRegions.has(t.region));
    if (dogOnly) pool = pool.filter(t => t.dogs && parseMiles(t.distance) <= 5);
    if (epicOnly) pool = pool.filter(t => parseMiles(t.distance) >= 8);

    if (pool.length === 0) {
      output.innerHTML = `<div class="no-results">No trails match your filters. Try adjusting your region or filters.</div>`;
      return;
    }

    const trail = weightedPick(pool);
    currentTrail = trail;

    const typeLabel = { hike: "Hike", run: "Run", both: "Hike & Run" }[trail.type];
    const typeBadge = { hike: "badge-hike", run: "badge-run", both: "badge-both" }[trail.type];

    const dogNote = trail.dogs
      ? `<div class="dog-note">🐾 <span>${trail.dogNote || 'Dogs allowed on leash'}</span></div>`
      : `<div class="dog-note" style="color:#b07070;">🚫 <span>No dogs permitted</span></div>`;

    const headsUpNote = trail.headsUp
      ? `<div class="heads-up">💡 <span>${trail.headsUp}</span></div>`
      : '';

    const postHikeHtml = trail.postHike.map(p => `
      <a href="${mapsUrl(p.mapQuery)}" target="_blank" class="posthike-item">
        <span class="map-arrow">🍺 ↗</span>
        <span class="posthike-item-inner"><strong>${p.name}</strong> — ${p.note}</span>
      </a>`
    ).join('');

    output.innerHTML = `
      <div class="card">
        <div class="card-header">
          <div class="trail-name">${trail.name}</div>
          <span class="badge ${typeBadge}">${typeLabel}</span>
        </div>
        <div class="region-row">
          <span class="region">${trail.region}</span>
          <a href="${mapsUrl(trail.trailhead)}" target="_blank" class="map-link">📍 Trailhead</a>
          <a href="${trail.allTrailsUrl}" target="_blank" class="map-link" style="background:#eef6ff;border-color:#b3d9ff;color:#1565c0;">🥾 AllTrails</a>
        </div>
        <p class="description">${trail.description}</p>
        <div class="meta">
          <span class="meta-pill">📍 ${trail.distance}</span>
          <span class="meta-pill">⛰️ ${trail.difficulty}</span>
        </div>
        ${headsUpNote}
        ${dogNote}
        ${trail.postHike.length > 0 ? `<div class="posthike">
          <div class="posthike-title">${rand(drinkLabels)}</div>
          ${postHikeHtml}
          <div class="posthike-disclaimer">Always check hours ahead — spots occasionally change.</div>
        </div>` : ''}
        <div class="share-row">
          <button class="share-btn" onclick="shareCard()">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
            Share
          </button>
        </div>
      </div>
    `;
  }

  let currentTrail = null;

  // ── Share card ─────────────────────────────────────────────────────────────

  const SHARE_SVG = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>`;

  function buildShareText(trail) {
    const dogLine = trail.dogs ? ' · 🐾' : '';
    const venues = trail.postHike
      .map(p => `🍺 ${p.name}\n${mapsUrl(p.mapQuery)}`)
      .join('\n\n');
    return [
      `🏔️ ${trail.name}`,
      `${trail.region} · ${trail.distance} · ${trail.difficulty}${dogLine}`,
      ...(trail.headsUp ? [`💡 ${trail.headsUp}`] : []),
      '',
      `📍 ${mapsUrl(trail.trailhead)}`,
      `🥾 ${trail.allTrailsUrl}`,
      '',
      venues
    ].join('\n');
  }

  async function shareCard() {
    if (!currentTrail) return;
    const btn = document.querySelector('.share-btn');
    const text = buildShareText(currentTrail);

    if (navigator.share) {
      try {
        await navigator.share({ text });
        return;
      } catch (e) {
        if (e.name === 'AbortError') return;
      }
    }

    // Fallback: copy to clipboard
    try {
      await navigator.clipboard.writeText(text);
      if (btn) {
        btn.textContent = 'Copied!';
        setTimeout(() => { btn.innerHTML = `${SHARE_SVG} Share`; }, 2000);
      }
    } catch (e) {
      prompt('Copy to share:', text);
    }
  }
</script>
</body>
</html>
