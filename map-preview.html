  <text x="60" y="282" font-size="86" font-weight="700" fill="#3a7d44">106</text>
  <text x="232" y="282" font-size="26" font-weight="600" fill="#3a5a3a">trails</text>
  <text x="62" y="316" font-size="18" fill="#4a6a4a">76 dog-friendly · 14 epic (8 mi+)</text>

  <g font-size="19" fill="#2d4a2d">
    <circle cx="71" cy="372" r="8" fill="#7F77DD"/><text x="92" y="378">SF + Marin</text><text x="300" y="378" text-anchor="end" fill="#7a9a7a" font-weight="600">29</text>

    <circle cx="71" cy="536" r="7" fill="#6a8a6a"/><text x="88" y="541">dog-friendly</text>
    <circle cx="206" cy="536" r="6.5" fill="#f0f4f0" stroke="#6a8a6a" stroke-width="2.5"/><text x="223" y="541">no dogs</text>
  </g>
  <text x="60" y="585" font-size="13" fill="#9ab09a">Each dot is a trailhead · positions approximate</text>
</svg>

 // [lon, lat, regionIndex, dog(1/0)]
 const T=[
  [-122.506,37.785,0,1],[-122.447,37.752,0,1],[-122.442,37.740,0,1],[-122.465,37.804,0,1],[-122.420,37.717,0,1],[-122.502,37.715,0,1],[-122.458,37.758,0,1],[-122.475,37.770,0,1],[-122.456,37.794,0,1],[-122.493,37.728,0,1],[-122.483,37.793,0,0],[-122.385,37.713,0,1],[-122.500,37.716,0,1],[-122.508,37.786,0,1],

 ];
 const FIPS=new Set(["06075","06041","06081","06085","06001","06013"]);
 const svg=d3.select('#og');
 const proj=d3.geoMercator();
 d3.json('https://cdn.jsdelivr.net/npm/us-atlas@3/counties-10m.json').then(function(us){
   const all=topojson.feature(us,us.objects.counties).features.filter(f=>FIPS.has(f.id));
   const fc={type:'FeatureCollection',features:all};
   proj.fitExtent([[565,70],[1150,575]],fc);
   const path=d3.geoPath(proj);
   const gMap=svg.append('g');
   gMap.selectAll('path').data(all).join('path').attr('d',path)
     .attr('fill','#e6ece6').attr('stroke','#c9d6c9').attr('stroke-width',0.8);
   const pts=T.map(t=>{const p=proj([t[0],t[1]]);return{c:COL[t[2]],dog:t[3],x:p[0],y:p[1]};});
   const groups={};pts.forEach(p=>{const k=Math.round(p.x)+'_'+Math.round(p.y);(groups[k]=groups[k]||[]).push(p);});
   Object.values(groups).forEach(arr=>{if(arr.length>1){arr.forEach((p,i)=>{const a=(i/arr.length)*6.2832;p.x+=Math.cos(a)*7;p.y+=Math.sin(a)*7;});}});
   const gDot=svg.append('g');
   gDot.selectAll('circle').data(pts).join('circle')
     .attr('cx',d=>d.x).attr('cy',d=>d.y).attr('r',6.5)
     .attr('fill',d=>d.dog?d.c:'#eef3ee')
     .attr('stroke',d=>d.dog?'#f0f4f0':d.c)
     .attr('stroke-width',d=>d.dog?1:2.5);
   window.__mapReady=true;
 });
})();
